name: Build Sinners base image
on:
  workflow_dispatch:
  push:
  schedule:
    - cron: 0 0 * * * # auto-update will pull at 2am

jobs:
  build:
    name: Build Sinners bootc image
    runs-on: ubuntu-latest
    environment: Build
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: sinners-bootc
      REGISTRY: ghcr.io/andybrwr

    steps:
      - name: Get current date
        id: date
        run: echo "::set-output name=date::$(date +'%Y%m%d')"

      - name: Free disk space
        run: |
          sudo rm -rf /opt/hostedtoolcache /usr/share/dotnet /usr/local/lib/android \
            /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/local/share/boost \
            /usr/local/share/powershell /usr/local/share/chromium /usr/lib/jvm \
            /opt/microsoft /opt/google /usr/local/lib/node_modules
          sudo docker image prune -af
          sudo mkdir -p /mnt/chunkah && sudo chown "$USER" /mnt/chunkah

      - name: Clone the repository
        uses: actions/checkout@v4

      - name: Build with buildah
        id: build-image
        uses: redhat-actions/buildah-build@v3
        with:
          image: ${{ env.IMAGE_NAME }}
          tags: latest ${{ github.sha }} ${{ steps.date.outputs.date }}
          containerfiles:
            ./Containerfile

      - name: Rechunk with chunkah
        env:
          IMG: localhost/${{ env.IMAGE_NAME }}:latest
          # keep podman's temp copies off the root disk
          TMPDIR: /mnt/chunkah
        run: |
          orig=$(podman image inspect --format '{{.Id}}' $IMG)
          podman run --rm --rmi \
            --mount=type=image,src=$IMG,dst=/chunkah \
            -e CHUNKAH_CONFIG_STR="$(podman inspect $IMG)" \
            quay.io/fedora/fedora-bootc:44 \
            /usr/libexec/bootc-base-imagectl rechunk --chunkah --max-layers 96 \
            > /mnt/chunkah/rechunked.ociarchive
          # drop the original build before importing so both aren't stored at once
          podman rmi -f "$orig"
          id=$(podman load -i /mnt/chunkah/rechunked.ociarchive | sed -n 's/^Loaded image: //p')
          rm -f /mnt/chunkah/rechunked.ociarchive
          test -n "$id"
          for tag in ${{ steps.build-image.outputs.tags }}; do
            podman tag "$id" "localhost/${{ env.IMAGE_NAME }}:$tag"
          done

      - name: Log in to ghcr
        uses: redhat-actions/podman-login@v1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to ghcr
        id: push-to-ghcr
        uses: redhat-actions/push-to-registry@v3
        with:
          image: ${{ steps.build-image.outputs.image }}
          tags: ${{ steps.build-image.outputs.tags }}
          registry: ${{ env.REGISTRY }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASS }}
          DIGEST: ${{ steps.push-to-ghcr.outputs.digest }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | cosign login ghcr.io -u ${{ github.actor }} --password-stdin
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}
